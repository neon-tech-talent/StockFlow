<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlowStock — Iniciar Sesión</title>
  <meta name="description" content="FlowStock — Plataforma de gestión para comercios">
  <meta name="theme-color" content="#171f18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <script src="js/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <style>
    :root {
      --bg-base:    #171f18;
      --bg-card:    #1e2a1f;
      --accent:     #c8a96e;
      --accent-dim: #a88a52;
      --accent-glow:rgba(200,169,110,0.15);
      --text-main:  #e8dcc4;
      --text-muted: #9a8a70;
      --border:     rgba(200,169,110,0.16);
      --border-hover:rgba(200,169,110,0.36);
      --radius:     12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(200,169,110,0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(122,184,122,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    /* Brand header */
    .brand {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .brand-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: .75rem;
      filter: drop-shadow(0 0 20px rgba(200,169,110,0.4));
      animation: floatIcon 3s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      line-height: 1;
    }
    .brand-tagline {
      font-size: .8rem;
      color: var(--text-muted);
      margin-top: .4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Card */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-card h2 {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 1.75rem;
      text-align: center;
    }

    /* Form */
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block;
      font-size: .78rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .4rem;
    }
    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .95rem;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Button */
    .btn-login {
      width: 100%;
      padding: .85rem;
      background: var(--accent);
      color: #1a1208;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
      margin-top: .5rem;
      letter-spacing: 0.04em;
    }
    .btn-login:hover {
      background: #d4b87a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,169,110,0.3);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    /* Error */
    .error-msg {
      background: rgba(192,92,92,0.12);
      border: 1px solid rgba(192,92,92,0.3);
      color: #e07070;
      border-radius: 8px;
      padding: .65rem 1rem;
      font-size: .85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .75rem;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .login-card { padding: 1.75rem 1.25rem; }
      .brand-name  { font-size: 1.9rem; }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <span class="brand-icon">📦</span>
      <div class="brand-name">FlowStock</div>
      <div class="brand-tagline">Plataforma de gestión comercial</div>
    </div>

    <div class="login-card">
      <h2>Iniciá sesión para continuar</h2>
      <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos.</div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input id="username" class="form-input" type="text" placeholder="Tu usuario" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Ingresar</button>
      </form>
    </div>

    <div class="login-footer">FlowStock © 2025 — Sistema de gestión</div>
  </div>

  <script>
    // Si ya hay sesión, redirigir directo
    (function() {
      const s = Auth.getSession();
      if (s) window.location.href = 'index.html';
    })();

    const supabaseUrl = window.SUPABASE_URL || '';
    const supabaseKey = window.SUPABASE_KEY || '';
    let _sb = null;
    try {
      if (supabaseUrl && supabaseKey) _sb = supabase.createClient(supabaseUrl, supabaseKey);
    } catch(e) {}

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn-login');
      const errEl    = document.getElementById('error-msg');

      errEl.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        if (!_sb) throw new Error('Base de datos no configurada.');

        const { data, error } = await _sb
          .from('admin_users')
          .select('id, username, role, active')
          .eq('username', username)
          .eq('password', password)
          .eq('active', true)
          .single();

        if (error || !data) {
          errEl.textContent = 'Usuario o contraseña incorrectos.';
          errEl.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Ingresar';
          return;
        }

        Auth.setSession({ id: data.id, username: data.username, role: data.role });

        // Si es superadmin, ir directo a index
        if (data.role === 'superadmin') {
          window.location.href = 'index.html';
          return;
        }

        // Si es admin, verificar si ya configuró su perfil
        const { data: profile } = await _sb
          .from('admin_profiles')
          .select('is_configured')
          .eq('admin_id', data.id)
          .single();

        if (!profile || !profile.is_configured) {
          window.location.href = 'onboarding.html';
        } else {
          window.location.href = 'index.html';
        }

      } catch (err) {
        errEl.textContent = 'Error de conexión. Verificá tu configuración.';
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
