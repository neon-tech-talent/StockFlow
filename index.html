<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlowStock — Gestión</title>
  <meta name="description" content="FlowStock — Sistema de control de stock, ventas y estadísticas">
  <meta name="theme-color" content="#171f18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Supabase & Chart.js via CDN -->
  <script src="js/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div id="sidebar-logo-icon" style="font-size:2.8rem;margin-bottom:.5rem;line-height:1;">📦</div>
      <h1 id="sidebar-system-name" style="text-transform:uppercase;font-size:.95rem;">FlowStock<br><small style="font-size:.7rem;color:var(--accent-dim);text-transform:none;letter-spacing:.05em;">Cargando...</small></h1>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- navegación se renderiza según el rol -->
    </nav>

    <div class="sidebar-footer">
      <div id="sidebar-username" style="margin-bottom:.4rem;font-weight:600;color:var(--text-muted);"></div>
      <button onclick="Auth.logout()" style="background:none;border:1px solid rgba(200,169,110,0.2);color:var(--text-muted);padding:.5rem .8rem;border-radius:6px;cursor:pointer;font-size:.8rem;font-family:inherit;transition:all .2s;width:100%;min-height:44px;"
        onmouseover="this.style.background='rgba(192,92,92,0.15)';this.style.color='#e07070';this.style.borderColor='rgba(192,92,92,0.35)'"
        onmouseout="this.style.background='none';this.style.color='var(--text-muted)';this.style.borderColor='rgba(200,169,110,0.2)'">
        🚪 Cerrar Sesión
      </button>
      <div style="margin-top:.5rem;">FlowStock © 2025</div>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <div class="main-wrap">
    <header class="topbar">
      <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Menú">☰</button>
      <h2 id="page-title">Cargando...</h2>
    </header>
    <main id="content"></main>
  </div>

  <!-- Modal overlay (filled dynamically) -->
  <div id="modal-overlay"></div>
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ── SCRIPTS ── -->
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/sales.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/caja.js"></script>
  <script src="js/superadmin.js"></script>
  <script src="js/app.js"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      const isOpen = sidebar.classList.toggle('sidebar-open');
      overlay.classList.toggle('active', isOpen);
      document.body.classList.toggle('body-menu-open', isOpen);
    }
    function closeSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.remove('sidebar-open');
      overlay.classList.remove('active');
      document.body.classList.remove('body-menu-open');
    }
    document.addEventListener('click', function(e) {
      if (e.target.closest('.nav-item') && window.innerWidth <= 768) closeSidebar();
    });
  </script>
</body>
</html>
